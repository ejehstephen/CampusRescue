version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campusrescue_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campusrescue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '8090:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/migrations/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d campusrescue"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
