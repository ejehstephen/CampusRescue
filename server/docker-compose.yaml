version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: campusrescue_postgres
    environment:
      POSTGRES_DB: campusrescue
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '8090:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  postgres_data:
